<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    
    <!-- Viewport & Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, shrink-to-fit=no" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Theme & Branding -->
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- SEO & Meta -->
    <title>DevKit - Professional Development Toolkit</title>
    <meta name="description" content="A premium development toolkit with forum, tools, and community features. Fast, responsive, and built for developers." />
    <meta name="keywords" content="development, tools, forum, community, developers" />
    <meta name="author" content="DevKit" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph & Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DevKit - Professional Development Toolkit" />
    <meta property="og:description" content="A premium development toolkit with forum, tools, and community features." />
    <meta property="og:url" content="https://devkit.app" />
    <meta property="og:site_name" content="DevKit" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevKit - Professional Development Toolkit" />
    <meta name="twitter:description" content="A premium development toolkit with forum, tools, and community features." />
    
    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://devkit.app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DevKit",
        "description": "A premium development toolkit with forum, tools, and community features",
        "url": "https://devkit.app",
        "applicationCategory": "DeveloperApplication"
      }
    </script>
  </body>
</html>
